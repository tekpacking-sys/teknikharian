<script>
function pilihArea() {

    $(document).ready(function() {

    // Fungsi Auto complete
    const shortcutMap = {
        a: ["Animal", "Appeton", "Apple ring", "Aquarium"],
        b: ["Baby Shark", "Bear", "Berrybonz","Beyond Fit", "Brite Worm"],
        c: ["Calci Bean", "CDZ", "Chocoo Glee", "Chop chop", "Chiby", "Chupa Chup", "Cola", "Cola bonz", "Cola Burger", "Cookies", "Cooktail", "Confetty kiss", "Crunchy Gummies"],

        f: ["Fitkom", "Fruit bites", "Frunkfuter", "Fun Gum"],
        g: ["Giant Cola", "Grape", "Gummy Bear", "Gummy Bunnies", "Gummy Fang", "Gummy Fries"], 
        h: ["Happy Bear 120 gr"], 
        i: ["Iced Cola", "Inaco"],
        j: ["JFF", "Jungle Fun"], 
        k: ["Krabby Patties", "Krabby Patties 72 gr", "Kuai kuai"],
        l: ["Little Star"], 
        m: ["MB Cola", "MB Max", "MB Sour", "MB Twin","MB WO", "MB Yupi", "MB Yupi 500gr", "Milly Moose", "Milk Shake", "Mini Monz", "My Watch"],
        n: ["Neon Stix", "Neon Stix 120 gr", "Noodle"], 
        o: ["OFF", "Orange"],
        p: ["Party Mix", "Pastilles", "Pizza", "Puzzle"], 
        q: ["QQ"], 
        r: ["Raspberry & Blackberry"],
        s: ["Sandwich", "Sour Giant Cola 500 gr", "Sour O Ring", "Sea World","Skulls",  "Starlite", "St kiss", "St kiss 45 gr", "St kiss 120 gr", "Sweet Heart"],
        t: ["TJ Joybee", "Tropical"], 
        v: ["Vicee", "Vidoran", "Vitaminis", "Vita C Gummies", "Vit D+"],
        w: ["Water Melon", "Worm"], 
        y: ["Yoghurt", "Youvit"],
        z: ["Zugi Zagi Zug"]
    };
    
    const setupAutocomplete = (input) => {
        let suggestionBox = document.createElement("div");
        suggestionBox.className = "custom-autocomplete-list";
        input.parentNode.appendChild(suggestionBox);
        input.addEventListener('input', () => {
    const fullVal = input.value;
    // Menggunakan regex agar lebih fleksibel terhadap spasi setelah koma
    const parts = fullVal.split(/,\s*/); 
    const lastPart = parts[parts.length - 1].toLowerCase(); 
    
    if (lastPart.length === 0) { 
        suggestionBox.style.display = "none"; 
        return; 
    }
    
    
    const firstChar = lastPart[0];
    if (shortcutMap[firstChar]) {
        
        const filtered = shortcutMap[firstChar].filter(item => 
            item.toLowerCase().startsWith(lastPart)
        );

        if (filtered.length > 0) {
            suggestionBox.innerHTML = "";
            suggestionBox.style.display = "block";
            filtered.forEach(item => {
                const div = document.createElement("div");
                div.className = "custom-autocomplete-item";
                div.textContent = item;
                div.onclick = (e) => {
                    e.preventDefault();
                    parts[parts.length - 1] = item;
                    input.value = parts.join(", ");
                    suggestionBox.style.display = "none";
                    input.focus();
                };
                suggestionBox.appendChild(div);
            });
        } else {
            suggestionBox.style.display = "none";
        }
    } else { 
        suggestionBox.style.display = "none"; 
    }
});
        document.addEventListener("click", (e) => { if (e.target !== input) suggestionBox.style.display = "none"; });
    };

    const statusInputs = ["starchless", "ishida", "ishida1", "kawashima", "multipond", "pp3", "dippy", "animal", "animal2", "zugi", "gfries", "gfries5", "noodle", "berry", "crunchy", "ishida2", "kwshima", "tl", "sandwich", "pp5", "mb4", "mb5", "max", "rollete", "watch"];

    // Fungsi untuk menyimpan semua data input ke localStorage
function saveData() {
    const inputs = document.querySelectorAll('input, select, textarea');
    const data = {};
    
    inputs.forEach(input => {
        // Khusus untuk select2 (multi), kita simpan nilainya sebagai array
        if (input.classList.contains('select2-multi')) {
            data[input.id || 'personil'] = $(input).val();
        } else {
            data[input.id] = input.value;
        }
    });
    
    localStorage.setItem('laporanShiftData', JSON.stringify(data));
}

// Fungsi untuk memuat data dari localStorage saat halaman dimuat
function loadData() {
    const savedData = localStorage.getItem('laporanShiftData');
    if (savedData) {
        const data = JSON.parse(savedData);
        for (const id in data) {
            const el = document.getElementById(id) || document.querySelector(`[name="${id}"]`);
            if (el) {
                if (el.classList.contains('select2-multi')) {
                    $(el).val(data[id]).trigger('change');
                } else {
                    el.value = data[id];
                }
            }
        }
        // Pastikan tampilan area yang dipilih muncul kembali
        pilihArea();
    }
}
    
    function baris(label, isi, lebar = 14, wrap = 34) {

    isi = (isi ?? "").toString().trim();
    if (!isi) isi = "-";

    const kiri = label.padEnd(lebar, " ");

    if (isi.length <= wrap) {
        return `${kiri}: ${isi}`;
    }

    let hasil = `${kiri}: ${isi.substring(0, wrap)}`;

    let sisa = isi.substring(wrap);

    while (sisa.length > 0) {
        hasil += "\n" + " ".repeat(lebar + 2) + sisa.substring(0, wrap);
        sisa = sisa.substring(wrap);
    }

    return hasil;
}
    
    function kirimKeWA() {

        ];

    //==========================

    let pesan = [];
    
    // Mengatur kolom agar titik dua selalu sejajar
function tambahData(arr, nama, nilai) {
    if (!nilai || nilai.trim() === "") return;

    const lebarKolom = 14; // bisa diubah 18-22
    const kiri = nama.padEnd(lebarKolom, " ");

    arr.push(`${kiri}: ${nilai}`);
}

// Menambahkan baris jumlah tepat di bawah mesin
function tambahJumlah(arr, jumlah) {
    if (!jumlah || jumlah.trim() === "") return;

    const kiri = "Jumlah".padEnd(14, " ");
    arr.push(`${kiri}: ${jumlah}`);
}

    pesan.push("```");
