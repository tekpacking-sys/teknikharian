<style>
    * { box-sizing: border-box; }
    body {
        background-color: #eefafa;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 5px;
    }

    .dashboard {
        max-width: 500px;

    }
    
    .sticky-header {
    position: sticky;
    top: 0;
    background-color: #eefafa; 
    z-index: 100;            
    padding-top: 5px;
    padding-bottom: 0px;
}

    .dash-header {
        display: flex;

        align-items: center;
        margin-bottom: 15px;
    }

    .dash-header h2 {
        margin: 0;

        flex: 1;
    }

    .add-btn {
        background: #00897b;

        padding: 8px 14px;

        font-weight: bold;
        cursor: pointer;
    }

    .filter-bar {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
    }

    .filter-bar input, .filter-bar select {

    /* CARD / TABEL STYLE */
    .laporan-card {
        background: transparent;

    .info-header {

    }

    .report-table {

    .modal {

<script>
// ==============================
// FIREBASE CONFIG & APP LOGIC
// ==============================
const firebaseConfig = {
    apiKey: "AIzaSyDWyfDxk0JYGjgwCqSZn6oOPGD9sBu3lH4",
    authDomain: "laporan-standby.firebaseapp.com",
    projectId: "laporan-standby",
    storageBucket: "laporan-standby.firebasestorage.app",
    messagingSenderId: "475663281847",
    appId: "1:475663281847:web:f2573121a8225887e22732"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function bukaForm() {
    document.getElementById("modalTitle").textContent = "Input Laporan Shift";
    document.getElementById("editDocId").value = "";
    document.getElementById("laporanForm").reset();
    $("#personil").val(null).trigger("change");
    pilihArea();
    document.getElementById("formModal").classList.add("show");
    document.body.style.overflow = "hidden";

    // Pastikan posisi scroll modal dimulai dari atas setiap kali form dibuka
    const modal = document.getElementById("formModal");
    requestAnimationFrame(() => {
        modal.scrollTop = 0;
    });

    // Re-trigger layout Select2 setelah modal tampil
    setTimeout(() => {
        $('#personil').select2({
            placeholder: "Pilih Nama",
            allowClear: true,
            width: '100%',
            dropdownParent: $('#formModal')
        });
    }, 100);
}

function tutupForm() {
    document.getElementById("formModal").classList.remove("show");
    document.body.style.overflow = "";
}

function tutupFormJikaLuar(event) {
    if (event.target === document.getElementById("formModal")) tutupForm();
}

function escapeHtml(value) {
    const map = { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" };
    return String(value ?? "").replace(/[&<>\"']/g, c => map[c]);
}

function renderRow(nama, produk, jumlah) {
    if (!produk && !jumlah) return "";
    let isOff = (produk && produk.trim().toUpperCase() === "OFF");
    let sigmaHtml = isOff ? `<span class="status-off">X</span>` : (jumlah || "");
    return `
        <tr>
            <td>${escapeHtml(nama)}</td>
            <td>${escapeHtml(produk || "-")}</td>
            <td class="text-center">${sigmaHtml}</td>
        </tr>
    `;
}

async function muatLaporan() {
    const daftar = document.getElementById("daftarLaporan");
    const status = document.getElementById("statusLaporan");
    daftar.innerHTML = "";
    status.textContent = "Memuat laporan...";

    try {
        let snap = await db.collection("laporan_shift").orderBy("dibuatPada", "desc").limit(50).get();
        const filterTanggal = document.getElementById("filterTanggal").value;

        let grouped = {};

        snap.forEach(doc => {
            const d = doc.data();
            if (filterTanggal && d.tanggal !== filterTanggal) return;

            const key = `${d.tanggal}_${d.shift}`;

            if (!grouped[key]) {
                grouped[key] = {
                    tanggal: d.tanggal,
                    tanggalTeks: d.tanggalTeks,
                    shift: d.shift,
                    kashift: d.kashift,
                    personilSet: new Set(),
                    docIds: [],
                    mergedData: {},
                    kerusakanSet: new Set(),
                    kerusakanByArea: {}
                };
            }

            // Gabungkan Personil
            if (Array.isArray(d.personil)) {
                d.personil.forEach(p => grouped[key].personilSet.add(p));
            } else if (typeof d.personil === "string" && d.personil.trim() !== "") {

            // Simpan Dokumen ID
            grouped[key].docIds.push(doc.id);

            // Gabungkan nilai mesin (ambil nilai non-kosong agar tidak saling timpa)

                if (d[field] !== undefined && d[field] !== null && d[field] !== "") {

                    if (!grouped[key].mergedData[field]) {

            }
        });

            yupi5Html += renderRow("Rollete", d.rollete, d.jrollete);

            // NOTE PEKERJAAN dipisahkan per area
            const urutanAreaNote = ["Yupi 1", "Yupi 3/4", "Yupi 5", "Lainnya"];

async function editLaporan(mainId) {
    try {
        const doc = await db.collection("laporan_shift").doc(mainId).get();
        if (!doc.exists) return alert("Data tidak ditemukan");
        const d = doc.data();

        document.getElementById("editDocId").value = mainId;
        document.getElementById("modalTitle").textContent = "Edit Laporan Shift";

        // Query seluruh dokumen pada Tanggal dan Shift yang sama
        const snapshot = await db.collection("laporan_shift")
            .where("tanggal", "==", d.tanggal)
            .where("shift", "==", d.shift)
            .get();

        let mergedData = {};
        let noteByArea = {};     // Pemetaan note kerusakan berdasarkan area
        let personilByArea = {}; // Pemetaan personil berdasarkan area

        snapshot.forEach(subDoc => {
            const subData = subDoc.data();
            
            // Tentukan identitas area dokumen
            let aKey = subData.area || "";
            if (!aKey && subData.areaText) {
                if (subData.areaText.includes("1")) aKey = "yupi1";
                else if (subData.areaText.includes("3") || subData.areaText.includes("4")) aKey = "yupi34";
                else if (subData.areaText.includes("5")) aKey = "yupi5";
            }

            // Simpan note berdasarkan key area
            if (aKey && subData.kerusakan) {
                noteByArea[aKey] = subData.kerusakan;
            }

            // Simpan personil berdasarkan key area
            if (aKey && subData.personil) {
                personilByArea[aKey] = subData.personil;
            }

            // Gabungkan field input lain (abaikan 'kerusakan' & 'personil' agar tidak saling timpa)
            for (let key in subData) {
                if (key !== "kerusakan" && key !== "personil" && subData[key] !== undefined && subData[key] !== null && subData[key] !== "") {
                    mergedData[key] = subData[key];
                }
            }
        });

        // 1. Tentukan Area spesifik dokumen yang diklik
        let areaVal = d.area || "";
        if (!areaVal && d.areaText) {
            if (d.areaText.includes("1")) areaVal = "yupi1";
            else if (d.areaText.includes("3") || d.areaText.includes("4")) areaVal = "yupi34";
            else if (d.areaText.includes("5")) areaVal = "yupi5";
        }

        // 2. Isi seluruh field form input (kecuali personil & kerusakan)
        for (let key in mergedData) {
            let el = document.getElementById(key);
            if (el) {
                el.value = mergedData[key];
            }
        }

        // 3. Set dropdown Area & tampilkan form area
        document.getElementById("area").value = areaVal;
        pilihArea();

        // 4. Ambil Personil & Note secara spesifik berdasarkan Area
        function updateAreaSpecificFields(targetArea) {
            // Set Personil
            const personilTepat = personilByArea[targetArea] || d.personil || [];
            $("#personil").val(personilTepat).trigger("change");

            // Set Note Pekerjaan
            const noteTepat = noteByArea[targetArea] !== undefined ? noteByArea[targetArea] : (d.kerusakan || "");
            document.getElementById("kerusakan").value = noteTepat;
        }

        // Jalankan pengisian personil & note untuk area yang dipilih pertama kali
        updateAreaSpecificFields(areaVal);

        // 5. Event listener saat pengguna mengganti pilihan Area di dropdown
        document.getElementById("area").onchange = function() {
            pilihArea();
            updateAreaSpecificFields(this.value);
        };

        // 6. Tampilkan Modal & Re-inisialisasi Select2
        document.getElementById("formModal").classList.add("show");
        document.body.style.overflow = "hidden";

        setTimeout(() => {
            $('#personil').select2({
                placeholder: "Pilih Nama",
                allowClear: true,
                width: '100%',
                dropdownParent: $('#formModal')
            });
        }, 100);

    } catch (e) {
        alert("Gagal memuat data edit: " + e.message);
    }
}

const setupAutocomplete = (input) => {
    let suggestionBox = document.createElement("div");
    suggestionBox.className = "custom-autocomplete-list";
    input.parentNode.appendChild(suggestionBox);
    input.addEventListener('input', () => {
        const fullVal = input.value;
        const parts = fullVal.split(/,\s*/); 
        const lastPart = parts[parts.length - 1].toLowerCase(); 
        
        if (lastPart.length === 0) { suggestionBox.style.display = "none"; return; }
        
        const firstChar = lastPart[0];
        if (shortcutMap[firstChar]) {
            const filtered = shortcutMap[firstChar].filter(item => item.toLowerCase().startsWith(lastPart));
            if (filtered.length > 0) {
                suggestionBox.innerHTML = "";
                suggestionBox.style.display = "block";
                filtered.forEach(item => {
                    const div = document.createElement("div");
                    div.className = "custom-autocomplete-item";
                    div.textContent = item;
                    div.onclick = (e) => {
                        e.preventDefault();
                        parts[parts.length - 1] = item;
                        input.value = parts.join(", ");
                        suggestionBox.style.display = "none";
                        input.focus();
                    };
                    suggestionBox.appendChild(div);
                });
            } else suggestionBox.style.display = "none";
        } else suggestionBox.style.display = "none";
    });
    document.addEventListener("click", (e) => { if (e.target !== input) suggestionBox.style.display = "none"; });
};

function baris(label, isi, lebar = 14, wrap = 34) {
    isi = (isi ?? "").toString().trim();
    if (!isi) isi = "-";
    const kiri = label.padEnd(lebar, " ");
    if (isi.length <= wrap) return `${kiri}: ${isi}`;
    let hasil = `${kiri}: ${isi.substring(0, wrap)}`;
    let sisa = isi.substring(wrap);
    while (sisa.length > 0) {
        hasil += "\n" + " ".repeat(lebar + 2) + sisa.substring(0, wrap);
        sisa = sisa.substring(wrap);
    }
    return hasil;
}
